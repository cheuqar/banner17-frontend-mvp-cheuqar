# Fly.io configuration for Chatbot Frontend (listez organization)
app = "listez-chatbot"
primary_region = "syd"  # Sydney region - change as needed

[build]
  dockerfile = "Dockerfile.production"

[env]
  PORT = "80"
  NODE_ENV = "production"
  # These will be set via secrets for security
  # VITE_API_BASE_URL = "https://listez-backend.fly.dev"
  # VITE_WS_BASE_URL = "wss://listez-backend.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Health checks (nginx serves static files, check root)
  [[http_service.checks]]
    interval = "30s"
    grace_period = "5s"
    method = "GET"
    path = "/"
    protocol = "http"
    timeout = "10s"
    tls_skip_verify = false

# Machine configuration - smaller for frontend
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Note: Using http_service (modern format) instead of services (legacy)

# Environment variables to set via secrets:
# fly secrets set VITE_API_BASE_URL=https://listez-backend.fly.dev --app listez-chatbot
# fly secrets set VITE_WS_BASE_URL=wss://listez-backend.fly.dev --app listez-chatbot
# fly secrets set NEXT_PUBLIC_SUPABASE_URL=your-supabase-url --app listez-chatbot
# fly secrets set NEXT_PUBLIC_SUPABASE_ANON_KEY=your-supabase-anon-key --app listez-chatbot
