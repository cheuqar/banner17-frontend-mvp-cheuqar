services:
  chatbot-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3301:3000"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://listez-backend.fly.dev}
      - VITE_WS_BASE_URL=${VITE_WS_BASE_URL:-wss://listez-backend.fly.dev}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
