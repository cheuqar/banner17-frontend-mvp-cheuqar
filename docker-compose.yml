services:
  chatbot-app-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: listez_chatbot_app_dev
    ports:
      - "3401:3001"
    environment:
      - NODE_ENV=development
      - VITE_PORT=3001
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api-dev.banner17.ai}
      - VITE_WS_BASE_URL=${VITE_WS_BASE_URL:-wss://api-dev.banner17.ai}
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - CHOKIDAR_USEPOLLING=true
      # BugSnag Error Monitoring
      - VITE_BUGSNAG_API_KEY=${VITE_BUGSNAG_API_KEY}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
      - VITE_ENABLE_BUGSNAG=${VITE_ENABLE_BUGSNAG:-false}
      - BUGSNAG_API_KEY=${BUGSNAG_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
    command: ./start-dev.sh
